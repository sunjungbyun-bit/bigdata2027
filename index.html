<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>환자 상태 요약 서비스</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#fff3b0}*{box-sizing:border-box}body{margin:0;background:#fff3b0}.app{max-width:1180px;margin:auto;padding:30px 20px}.hero{padding:26px;border-radius:20px;background:linear-gradient(135deg,#102a56,#2471a8);color:white;box-shadow:0 10px 30px #12345b22}.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;color:#dbeafe}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:20px}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 4px 16px #1e293b0a}.panel h2,.card h2{margin:0 0 14px;font-size:18px}.patients{display:grid;gap:8px}.patient{width:100%;padding:12px;border:1px solid #e2e8f0;background:#fff;border-radius:11px;text-align:left;cursor:pointer}.patient:hover,.patient.active{border-color:#2f80c0;background:#eef7ff}.patient strong,.patient small{display:block}.patient small{margin-top:4px;color:#64748b}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f1ff;color:#1d5d91;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f8fafc;padding:12px;border-radius:12px}.metric span{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.metric strong{font-size:16px}.summary{line-height:1.7;white-space:pre-wrap}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{color:#475569;background:#f8fafc}.alert{color:#b91c1c;font-weight:700}.no{color:#64748b}.muted{color:#64748b}.loading{padding:35px;text-align:center;color:#64748b}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="app"><section class="hero"><h1>환자 상태 요약</h1><p>두 CSV의 경과기록을 바탕으로 진단명, 현재 상태와 급성췌장염 Ranson’s criteria를 확인합니다.</p></section><div class="layout"><aside class="panel"><h2>환자 목록</h2><div id="patients" class="patients"><div class="loading">불러오는 중…</div></div></aside><section id="detail"><div class="card loading">환자를 선택하세요.</div></section></div></main>
<script>
const patientList=document.querySelector('#patients'),detail=document.querySelector('#detail');let patients=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){patients=await fetch('/api/patients').then(r=>r.json());patientList.innerHTML=patients.map((p,i)=>`<button class="patient ${i===0?'active':''}" data-id="${esc(p.id)}"><strong>${esc(p.name)}</strong><small>${esc(p.diagnosis)}</small></button>`).join('');patientList.querySelectorAll('.patient').forEach(b=>b.onclick=()=>{patientList.querySelectorAll('.patient').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.id)});if(patients[0])load(patients[0].id)}
async function load(id){detail.innerHTML='<div class="card loading">분석 중…</div>';const p=await fetch(`/api/patients/${encodeURIComponent(id)}/summary`).then(r=>r.json());const r=p.ranson;const summary=p.summary||{text:p.fallback||'요약을 만들 수 없습니다.',source:p.error?'대체 요약':'요약'};detail.innerHTML=`<div class="card"><h2>${esc(p.name)} <span class="badge">${esc(p.id)}</span></h2><div class="grid"><div class="metric"><span>진단명</span><strong>${esc(p.diagnosis)}</strong></div><div class="metric"><span>현재 상태</span><strong>${p.icu?'중환자실':'일반병동'} · ${esc(p.hospitalDay)}일차</strong></div><div class="metric"><span>기준일</span><strong>${esc(p.date)}</strong></div></div></div><div class="card"><h2>요약 <span class="badge">${esc(summary.source||'요약')}</span></h2><div class="summary">${esc(summary.text||summary.fallback||'요약을 만들 수 없습니다.')}</div></div>${r?renderRanson(r):''}<div class="card"><h2>최근 기록</h2><div class="table-wrap"><table><tr><th>항목</th><th>내용</th></tr>${[['주요 검사','WBC '+p.current.WBC_10e3_uL+' · Cr '+p.current.Cr_mg_dL+' · BUN '+p.current.BUN_mg_dL],['활력징후','BT '+p.current.BT_max_C+'℃ · SBP '+p.current.SBP_min_mmHg+' · SpO₂ '+p.current.SpO2_min_pct+'%'],['치료/처치',p.current.antibiotics||p.current.main_procedure||'-'],['경과',p.current.notes||'-'],['식이/지시',p.order?.diet_order+' / '+p.order?.physician_text_order]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table></div></div>`}
function renderRanson(r){return `<div class="card"><h2>Ranson’s criteria <span class="badge">${esc(r.type)} · ${r.score}점</span></h2><p class="muted">입력된 검사값으로 계산했습니다. 자료 없음은 음성으로 계산하지 않고 별도로 표시합니다.</p><div class="table-wrap"><table><tr><th>기준</th><th>측정값</th><th>판정 기준</th><th>결과</th><th>시점</th></tr>${r.items.map(i=>`<tr><td>${esc(i.label)}</td><td>${i.value==null?'<span class="muted">자료 없음</span>':esc(i.value+' '+i.unit)}</td><td>${esc(i.threshold)} ${esc(i.unit)}</td><td class="${i.met?'alert':'no'}">${i.met?'충족':'미충족'}</td><td>${esc(i.source)}</td></tr>`).join('')}</table></div><p class="muted">${esc(r.note)}</p></div>`}
init().catch(e=>detail.innerHTML='<div class="card alert">데이터를 불러오지 못했습니다: '+esc(e.message)+'</div>');
</script></body></html>
